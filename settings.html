<div id="swipe-archiver-settings">
    <div class="inline-drawer wide100p">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Swipe Archiver">Swipe Archiver</b>
            <div class="fa-solid fa-circle-chevron-down inline-drawer-icon down"></div>
        </div>
        <div class="inline-drawer-content">
            <span style="font-size: 10px; margin-bottom: 12px; display: block; text-align: center; opacity: 0.7;">Enable to view previous swipes of a chat.</span>
            <label class="checkbox_label" for="swipe-archiver-enabled" style="padding-bottom: 0px;border-top: 1px solid var(--SmartThemeBorderColor); padding-top: 10px; column-gap: 1px;"></label>
                <input id="swipe-archiver-enabled" type="checkbox" />
                <span data-i18n="Enable Swipe Archiver">Enable Swipe Archiver</span>
            </label>
        </div>
    </div>
</div>
